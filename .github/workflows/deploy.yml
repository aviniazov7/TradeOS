name: Deploy TradeOS

# Push to main → build → deploy. Replaces the manual `npm run deploy`.
# After deploy, the new CACHE_NAME makes the service worker register a new
# version and the in-app "גרסה חדשה זמינה" banner appears for users.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; a newer push cancels an in-flight one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # secrets.* can't be used inside an `if:` expression, so expose the
    # Cloudflare token as an env var here and gate the Worker step on env.*
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Firebase web config is hardcoded as a fallback in src/services/firebase.js,
      # so no VITE_FIREBASE_* env vars are needed here for the build to work.
      - name: Build
        run: npm run build

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy Hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools deploy --only hosting,firestore:rules --project tradeos-91a58 --non-interactive

      # Cloudflare Worker (Telegram bot + exchange sync proxy). Only runs if the
      # CLOUDFLARE_API_TOKEN secret is set — otherwise skipped, and the Worker
      # keeps running its previously-deployed version (deploy it manually if it changed).
      - name: Deploy Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
