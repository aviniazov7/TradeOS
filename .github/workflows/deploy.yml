name: Deploy TradeOS

# Push to main → build → deploy. Replaces the manual `npm run deploy`.
# After deploy, the new CACHE_NAME makes the service worker register a new
# version and the in-app "גרסה חדשה זמינה" banner appears for users.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; a newer push cancels an in-flight one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

# Needed so the auto-version-bump step can push back to main.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # secrets.* can't be used inside an `if:` expression, so expose the
    # Cloudflare token as an env var here and gate the Worker step on env.*
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Auto-bump APP_VERSION + CACHE_NAME so users always get the update
      # banner without anyone remembering to do it manually. The "[skip ci]"
      # commit message stops this push from re-triggering the workflow.
      - name: Bump version
        run: |
          node scripts/bump-version.mjs
          git config user.name 'Avraham Niazov'
          git config user.email 'aviniazov7@icloud.com'
          git add src/utils/constants.js public/sw.js
          git commit -m 'chore: bump version [skip ci]'
          git push origin HEAD:main

      # Firebase web config is hardcoded as a fallback in src/services/firebase.js,
      # so no VITE_FIREBASE_* env vars are needed here for the build to work.
      - name: Build
        run: npm run build

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"

      # Hosting only. The firebase-adminsdk service account can deploy Hosting
      # but lacks Service Usage permission to deploy firestore:rules (403 on the
      # API-enablement check). Firestore rules change rarely — deploy them
      # manually with `firebase deploy --only firestore:rules` when they change,
      # or grant the SA roles/serviceusage.serviceUsageViewer to re-enable here.
      - name: Deploy Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools deploy --only hosting --project tradeos-91a58 --non-interactive

      # Cloudflare Worker (Telegram bot + exchange sync proxy + AI proxy).
      # Only runs if the CLOUDFLARE_API_TOKEN secret is set — otherwise skipped,
      # and the Worker keeps running its previously-deployed version. The
      # wrangler.toml lives in worker/, so the step cd's into that directory.
      - name: Deploy Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: worker
        run: npx wrangler deploy
