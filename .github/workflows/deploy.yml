name: Deploy TradeOS

# Three-stage deploy pipeline:
#
#   push → main             → 🚀 production (Hosting live + production Worker)
#   push → dev          → 🧪 staging (Hosting "dev" channel + staging Worker)
#   push → feature/fix/hotfix → 🔍 preview channel (Hosting only, uses staging Worker)
#   pull_request → main|dev → 🔍 preview channel + comment URL on the PR
#
# Production is the only target that auto-bumps the cache version.
on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Each ref gets its own concurrency group — pushing twice to the same branch
# cancels the in-flight run, but different branches deploy in parallel.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # for the auto-version-bump push back to main
  pull-requests: write  # for the preview-URL comment on PRs

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Pins the account explicitly so wrangler skips its /memberships
      # auto-detection lookup — that lookup needs a User Details:Read scope
      # our narrowly-scoped CI token doesn't have (and shouldn't need).
      CLOUDFLARE_ACCOUNT_ID: ba3af41d3a78e629471174633c957cc9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Classify the run once so the rest of the workflow is just simple
      # boolean checks against these outputs.
      - name: Classify target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "kind=production" >> $GITHUB_OUTPUT
            echo "worker_url=https://trade-os.tradeos.workers.dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "kind=staging" >> $GITHUB_OUTPUT
            # NOTE: there is no real staging Worker. The root wrangler.jsonc
            # has no [env.staging], and the redirected config generated by the
            # Cloudflare vite plugin makes `wrangler deploy --env staging`
            # deploy to the production worker "trade-os" anyway (verified in
            # CI logs). trade-os-staging.workers.dev has no live deployment,
            # so builds must point at the worker that actually serves traffic.
            echo "worker_url=https://trade-os.tradeos.workers.dev" >> $GITHUB_OUTPUT
            echo "channel=dev" >> $GITHUB_OUTPUT
          else
            # Feature branch push OR pull request — preview channel only.
            echo "kind=preview" >> $GITHUB_OUTPUT
            echo "worker_url=https://trade-os.tradeos.workers.dev" >> $GITHUB_OUTPUT
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              CHANNEL="pr-${{ github.event.number }}"
            else
              CHANNEL="${{ github.ref_name }}"
            fi
            CHANNEL=$(echo "$CHANNEL" | tr '/' '-' | tr -cd '[:alnum:]-' | cut -c1-30)
            echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          fi

      # Production gets a cache-busting version bump so the in-app
      # "new version available" banner triggers. Staging/preview reuse the
      # current version — they're for testing, not for shipping to users.
      - name: Bump version (production only)
        if: steps.target.outputs.kind == 'production'
        run: |
          node scripts/bump-version.mjs
          git config user.name 'Avraham Niazov'
          git config user.email 'aviniazov7@icloud.com'
          git add src/utils/constants.js public/sw.js
          git commit -m 'chore: bump version [skip ci]'
          git push origin HEAD:main

      # Build with the worker URL appropriate for this target so the client
      # bundle talks to the right backend.
      - name: Build
        env:
          VITE_WORKER_URL: ${{ steps.target.outputs.worker_url }}
        run: npm run build

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"

      # ─── Hosting ─────────────────────────────────────────────────────────

      - name: Deploy Hosting (production)
        if: steps.target.outputs.kind == 'production'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools deploy --only hosting --project tradeos-91a58 --non-interactive

      - name: Deploy Hosting (preview channel)
        if: steps.target.outputs.kind != 'production'
        id: preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          echo "Deploying to preview channel: $CHANNEL"
          npx firebase-tools hosting:channel:deploy "$CHANNEL" \
            --project tradeos-91a58 --expires 7d --non-interactive 2>&1 | tee deploy.log
          # Pluck the preview URL out of the CLI output for the PR comment.
          URL=$(grep -oE 'https://tradeos-91a58--[^[:space:]]+web\.app' deploy.log | head -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      # ─── Cloudflare Worker ───────────────────────────────────────────────

      - name: Deploy Worker (production)
        if: steps.target.outputs.kind == 'production' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler deploy

      - name: Deploy Worker (staging)
        if: steps.target.outputs.kind == 'staging' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler deploy --env staging

      # Push all secrets to whichever Worker just deployed. Skipped for
      # preview-only runs (no Worker deploy happens then; preview reuses the
      # last staging deploy).
      - name: Set Worker secrets
        if: (steps.target.outputs.kind == 'production' || steps.target.outputs.kind == 'staging') && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        env:
          # ALWAYS target the production `trade-os` Worker (no --env flag):
          # the vite redirect makes every deploy from this repo — including
          # `--env staging` — update trade-os itself, but secrets pushed with
          # `--env staging` went to "trade-os-staging", a Worker with no live
          # deployment. Result: every dev push updated trade-os's CODE while
          # its SECRETS stayed stale (discovered when a rotated Resend key
          # never took effect).
          ENV_FLAG: ''
          VAPID_JWK: ${{ secrets.VAPID_JWK }}
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO_ADMIN_OVERRIDE: ${{ secrets.MAIL_TO_ADMIN_OVERRIDE }}
        run: |
          put_secret() {
            local name="$1"
            local value="${!name}"
            if [ -z "$value" ]; then
              echo "$name not set — skipping."
              return 0
            fi
            # Cloudflare's API occasionally 504s — retry with backoff so a
            # transient hiccup doesn't fail an otherwise-successful deploy.
            for attempt in 1 2 3; do
              if printf '%s' "$value" | npx wrangler secret put "$name" $ENV_FLAG; then
                return 0
              fi
              echo "secret put $name failed (attempt $attempt), retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            echo "::error::Failed to upload secret $name after 3 attempts"
            return 1
          }
          put_secret VAPID_JWK
          put_secret MORALIS_API_KEY
          put_secret GEMINI_API_KEY
          put_secret GROQ_API_KEY
          put_secret FIREBASE_SERVICE_ACCOUNT
          put_secret RESEND_API_KEY
          put_secret MAIL_FROM_ADDRESS
          put_secret MAIL_FROM_NAME
          put_secret MAIL_TO_ADMIN_OVERRIDE

      # ─── Alerts/cron Worker ──────────────────────────────────────────────
      # tradeos-alerts is the CRON runner: the same worker/index.js deployed
      # under a second name with the */10 schedule (trade-os itself has no cron
      # trigger). It was only ever deployed manually, so cron-side fixes never
      # shipped — this step keeps it in lockstep with every Worker deploy.
      # The vite plugin's deploy-config redirect hijacks any wrangler call in
      # this repo to trade-os, so the redirect file is removed first (the steps
      # that need it have already run) and wrangler.toml applies. There is only
      # ONE production cron (staging cron is disabled), so this deploys the
      # production alerts worker from dev too — same reality as trade-os.
      # Manually-set secrets (GROQ_API_KEY, CREDS_ENCRYPTION_KEY…)
      # persist across deploys; the CI-managed set is re-pushed here.
      - name: Deploy Worker (alerts cron) + secrets
        if: (steps.target.outputs.kind == 'production' || steps.target.outputs.kind == 'staging') && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        env:
          VAPID_JWK: ${{ secrets.VAPID_JWK }}
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO_ADMIN_OVERRIDE: ${{ secrets.MAIL_TO_ADMIN_OVERRIDE }}
        run: |
          # Both the redirect file AND wrangler's config discovery resolve to
          # the ROOT wrangler.jsonc even from this directory (verified in CI
          # logs — a bare `npx wrangler deploy` here re-deployed trade-os).
          # --config pins the alerts toml explicitly; the rm guards against
          # the redirect ever applying on top of it.
          rm -f ../.wrangler/deploy/config.json
          npx wrangler deploy --config wrangler.toml
          put_secret() {
            local name="$1"
            local value="${!name}"
            if [ -z "$value" ]; then
              echo "$name not set — skipping."
              return 0
            fi
            for attempt in 1 2 3; do
              if printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.toml; then
                return 0
              fi
              echo "secret put $name failed (attempt $attempt), retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            echo "::error::Failed to upload secret $name after 3 attempts"
            return 1
          }
          put_secret VAPID_JWK
          put_secret MORALIS_API_KEY
          put_secret GEMINI_API_KEY
          put_secret GROQ_API_KEY
          put_secret FIREBASE_SERVICE_ACCOUNT
          put_secret RESEND_API_KEY
          put_secret MAIL_FROM_ADDRESS
          put_secret MAIL_FROM_NAME
          put_secret MAIL_TO_ADMIN_OVERRIDE

      # ─── PR Comment with preview URL ─────────────────────────────────────
      # On every PR push, drop a comment with the preview link so the author
      # can click and test without hunting through the Actions logs.
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.preview.outputs.url }}`;
            const marker = '<!-- tradeos-preview-comment -->';
            const body = `${marker}
            🚀 **Preview ready**

            ${url}

            _Channel expires in 7 days. Pushing more commits to this PR updates the preview._`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
