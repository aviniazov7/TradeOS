# One-time (idempotent, re-runnable) migration of TradeOS to the new
# Cloudflare account (Tradeos.app@gmail.com). Runs ONLY manually via
# workflow_dispatch — never on push.
#
# What it does, in order:
#   1. Creates (or finds) an ALERTS_KV namespace in the NEW account.
#   2. Copies every key (value + expiration) from the old namespace into it —
#      read-only against the old account (CF_TOKEN_OLD is a KV:Read token).
#   3. Builds the client and deploys trade-os to the NEW account.
#   4. Deploys tradeos-alerts to the NEW account with its CRON DISABLED —
#      the old account's cron keeps running alone until cutover, so users
#      never get duplicate notifications.
#   5. Pushes the CI-managed secrets to both new workers. Manually-managed
#      secrets (GROQ_API_KEY, BOT_TOKEN, CREDS_ENCRYPTION_KEY, DEV_CHAT_ID)
#      must be set once at cutover.
#   6. Smoke-tests the new /health endpoint.
#
# The OLD account is never modified. Cutover (flipping clients + enabling the
# new cron + disabling the old one) is a separate, later step.
name: Migrate to new Cloudflare account

on:
  workflow_dispatch:

env:
  OLD_ACCOUNT: 6580bc70fcb5b17505bff6a719b69fd5
  NEW_ACCOUNT: ba3af41d3a78e629471174633c957cc9
  OLD_KV: 75931d3210024df0b6dd2938ee4656c1

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Create (or find) ALERTS_KV in the new account
        id: kv
        env:
          CF_TOKEN_NEW: ${{ secrets.CF_TOKEN_NEW }}
        run: |
          NS=$(curl -sf -H "Authorization: Bearer $CF_TOKEN_NEW" \
            "https://api.cloudflare.com/client/v4/accounts/$NEW_ACCOUNT/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="ALERTS_KV") | .id')
          if [ -z "$NS" ]; then
            NS=$(curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN_NEW" -H "Content-Type: application/json" \
              -d '{"title":"ALERTS_KV"}' \
              "https://api.cloudflare.com/client/v4/accounts/$NEW_ACCOUNT/storage/kv/namespaces" | jq -r '.result.id')
            echo "created new namespace: $NS"
          else
            echo "namespace already exists: $NS"
          fi
          [ -n "$NS" ] && [ "$NS" != "null" ] || { echo "::error::failed to resolve namespace"; exit 1; }
          echo "id=$NS" >> "$GITHUB_OUTPUT"

      - name: Copy all KV keys (values + expirations)
        env:
          CF_TOKEN_OLD: ${{ secrets.CF_TOKEN_OLD }}
          CF_TOKEN_NEW: ${{ secrets.CF_TOKEN_NEW }}
          NEW_KV: ${{ steps.kv.outputs.id }}
        run: node scripts/migrate-kv.mjs

      - name: Build client
        run: npm run build

      - name: Deploy trade-os to the new account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN_NEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.NEW_ACCOUNT }}
          NEW_KV: ${{ steps.kv.outputs.id }}
        run: |
          # The build baked the OLD account's KV id into the generated config —
          # point it at the new namespace before deploying.
          sed -i "s/$OLD_KV/$NEW_KV/g" dist/trade_os/wrangler.json
          npx wrangler deploy

      - name: Deploy tradeos-alerts to the new account (cron disabled)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN_NEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.NEW_ACCOUNT }}
          NEW_KV: ${{ steps.kv.outputs.id }}
        run: |
          rm -f ../.wrangler/deploy/config.json
          sed -i "s/$OLD_KV/$NEW_KV/g" wrangler.toml
          # No cron on the new copy yet — the old account's cron keeps running
          # alone until cutover (prevents duplicate pushes to users).
          sed -i 's|crons = \["\*/10 \* \* \* \*"\]|crons = []|' wrangler.toml
          grep -n "crons" wrangler.toml
          npx wrangler deploy --config wrangler.toml

      - name: Push CI-managed secrets to both new workers
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN_NEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.NEW_ACCOUNT }}
          VAPID_JWK: ${{ secrets.VAPID_JWK }}
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO_ADMIN_OVERRIDE: ${{ secrets.MAIL_TO_ADMIN_OVERRIDE }}
        run: |
          put_secret() {
            local name="$1" flag="$2"
            local value="${!name}"
            if [ -z "$value" ]; then
              echo "$name not set — skipping."
              return 0
            fi
            for attempt in 1 2 3; do
              if printf '%s' "$value" | npx wrangler secret put "$name" $flag; then
                return 0
              fi
              echo "secret put $name failed (attempt $attempt), retrying..."
              sleep $((attempt * 5))
            done
            echo "::error::Failed to upload secret $name"
            return 1
          }
          for s in VAPID_JWK MORALIS_API_KEY GEMINI_API_KEY FIREBASE_SERVICE_ACCOUNT RESEND_API_KEY MAIL_FROM_ADDRESS MAIL_FROM_NAME MAIL_TO_ADMIN_OVERRIDE; do
            # trade-os (redirected root config was already consumed; use the
            # generated dist config the deploy used)
            put_secret "$s" "--config ../dist/trade_os/wrangler.json"
            # tradeos-alerts
            put_secret "$s" "--config wrangler.toml"
          done

      - name: Smoke test the new deployment
        run: |
          # workers.dev DNS for a fresh subdomain can take a minute — retry.
          for i in 1 2 3 4 5 6; do
            if curl -sf https://trade-os.tradeos.workers.dev/health; then
              echo ""
              echo "new trade-os is alive ✔"
              exit 0
            fi
            echo "not up yet (attempt $i), waiting..."
            sleep 15
          done
          echo "::error::new worker did not respond on /health"
          exit 1
