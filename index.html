<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- TradeOS ships its own light/dark themes, so tell the Dark Reader
         browser extension to leave the page alone. Without this, Dark Reader
         re-tints our glassmorphism surfaces and produces weird banding/strips. -->
    <meta name="darkreader-lock" />
    <meta name="description" content="TradeOS — יומן מסחר חכם עם AI, סנכרון בורסות אוטומטי, ומעקב ארנקים. בעברית." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (link previews). The og-image URL is bumped with a version
         tag on every release so Telegram/WhatsApp/Twitter re-fetch the preview
         instead of serving the old cached one. summary_large_image gives the
         large hero card on Twitter/Telegram. -->
    <meta property="og:title" content="TradeOS — יומן מסחר חכם" />
    <meta property="og:description" content="סנכרון אוטומטי מהבורסה • מנטור AI בעברית • מעקב ארנקים על הבלוקצ'יין • התראות חכמות" />
    <meta property="og:image" content="https://tradeos-91a58.web.app/og-image.png?v=2.1.0" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tradeos-91a58.web.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeOS — יומן מסחר חכם" />
    <meta name="twitter:description" content="סנכרון אוטומטי מהבורסה • מנטור AI בעברית • מעקב ארנקים על הבלוקצ'יין" />
    <meta name="twitter:image" content="https://tradeos-91a58.web.app/og-image.png?v=2.1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>TradeOS</title>

    <!-- Google Identity Services (for PWA auth) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#000000] text-[#f0f0f0] antialiased">
    <div id="root"></div>
    <div id="datepicker-portal"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
