<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="TradeOS - מערכת ניהול מסחר מתקדמת" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (link previews) -->
    <meta property="og:title" content="TradeOS" />
    <meta property="og:description" content="מערכת ניהול מסחר מתקדמת - יומן, בקטסט, ניתוחים" />
    <meta property="og:image" content="https://tradeos-91a58.web.app/og-image.png" />
    <meta property="og:url" content="https://tradeos-91a58.web.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TradeOS" />
    <meta name="twitter:description" content="מערכת ניהול מסחר מתקדמת" />
    <meta name="twitter:image" content="https://tradeos-91a58.web.app/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>TradeOS</title>

    <!-- Google Identity Services (for PWA auth) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#000000] text-[#f0f0f0] antialiased">
    <div id="root"></div>
    <div id="datepicker-portal"></div>
    <script>
      // Prevent pinch-to-zoom on iOS Safari (must block touchstart + touchmove + gesture events)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });
      window.addEventListener('gesturestart', function(e) { e.preventDefault(); });
      window.addEventListener('gesturechange', function(e) { e.preventDefault(); });
      window.addEventListener('gestureend', function(e) { e.preventDefault(); });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
