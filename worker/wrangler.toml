name = "tradeos-alerts"
main = "index.js"
# Same Node.js surface as the HTTP worker (wrangler.jsonc). Gmail SMTP uses
# worker-mailer, which opens the socket through cloudflare:sockets rather
# than node:net. nodejs_compat stays on because that library's docs ask for
# it, and the flag is not the default until compatibility date 2026-08-04.
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]

# Cron trigger - runs every 10 minutes (optimized for KV free tier)
[triggers]
crons = ["*/10 * * * *"]

# KV namespace for storing alerts
[[kv_namespaces]]
binding = "ALERTS_KV"
id = "5c66041d98aa4229a52afeb2f5b1f652"

# ─── Vars ─────────────────────────────────────────────────────────────────
# Wyckoff scanner master switch. 'true' activates scanWyckoffSetups() inside the
# cron; remove it (or set anything else) to instantly turn the scanner off again.
[vars]
SCANNER_ENABLED = "true"

# ─── Staging environment ────────────────────────────────────────────────
# Deployed by the `dev` branch via GitHub Actions to
# https://tradeos-alerts-staging.tradeos.workers.dev.
#
# - Shares the production KV namespace. Solo dev, low risk; full database
#   separation is future work. Be careful with destructive test operations.
# - Cron is disabled here so the weekly digest / churn / expiry pushes only
#   fire from production and admins don't receive duplicates.
# - Secrets must be set with `wrangler secret put NAME --env staging`. The
#   deploy workflow does this automatically from GitHub Secrets.
[env.staging]
name = "tradeos-alerts-staging"

[[env.staging.kv_namespaces]]
binding = "ALERTS_KV"
id = "5c66041d98aa4229a52afeb2f5b1f652"

[env.staging.triggers]
crons = []
