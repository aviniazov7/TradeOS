name = "tradeos-alerts"
main = "index.js"
# AI quota (AiQuotaDO / AI_QUOTA) is bound only on the HTTP worker
# (../wrangler.jsonc). This cron script does not charge it. Do not add a
# second namespace here — the two scripts would not share objects.
# Same Node.js surface as the HTTP worker (wrangler.jsonc). Gmail SMTP uses
# worker-mailer, which opens the socket through cloudflare:sockets rather
# than node:net. nodejs_compat stays on because that library's docs ask for
# it, and the flag is not the default until compatibility date 2026-08-04.
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]

# Cron trigger - runs every 10 minutes (optimized for KV free tier)
[triggers]
crons = ["*/10 * * * *"]

# KV namespace for storing alerts
[[kv_namespaces]]
binding = "ALERTS_KV"
id = "5c66041d98aa4229a52afeb2f5b1f652"

# ─── Staging environment ────────────────────────────────────────────────
# NOT deployed by CI. `dev` deploys the HTTP worker from ../wrangler.jsonc,
# not this file. ALERTS_KV below is the staging namespace (same id as
# wrangler.jsonc env.staging), not the production namespace.
# Cron stays empty so a future staging worker cannot double-send digests.
# Do not `wrangler deploy --env staging` from this directory until a staging
# alerts cron is intentional. Secrets for that worker are dashboard/CI
# secrets, not this file.
[env.staging]
name = "tradeos-alerts-staging"

[[env.staging.kv_namespaces]]
binding = "ALERTS_KV"
id = "ac57c9487d5044eda008e06100a05758"

[env.staging.triggers]
crons = []
