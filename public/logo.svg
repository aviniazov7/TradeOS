<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Signature app gradient: violet → cyan (--accent-gradient) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Glass candle body -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9adbe8" stop-opacity="0.10"/>
    </linearGradient>
    <!-- Specular top highlight strip -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Left-edge vertical light streak -->
    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft ambient glow behind the mark -->
    <radialGradient id="ambient" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWick" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pure black base -->
  <rect width="1024" height="1024" fill="#000000"/>
  <rect width="1024" height="1024" fill="url(#ambient)"/>

  <!-- ===== T monogram (signature violet→cyan gradient) ===== -->
  <g filter="url(#glowStrong)">
    <path d="M 210 250
             L 610 250
             L 610 342
             L 458 342
             L 458 774
             L 362 774
             L 362 342
             L 210 342
             Z"
          fill="url(#accent)"/>
  </g>
  <path d="M 210 250 L 610 250 L 610 342 L 458 342 L 458 774 L 362 774 L 362 342 L 210 342 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5"/>

  <!-- ===== Rising trend line (behind candles) ===== -->
  <g filter="url(#glowSoft)">
    <path d="M 268 812 L 448 682 L 548 730 L 826 428"
          fill="none" stroke="url(#accentLine)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Glass candlesticks, ascending ===== -->
  <!-- candle 1 -->
  <g>
    <line x1="576" y1="586" x2="576" y2="800" stroke="#7deaff" stroke-width="9" stroke-linecap="round" filter="url(#glowWick)"/>
    <rect x="528" y="626" width="96" height="134" rx="20" fill="url(#glassBody)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="531" y="629" width="20" height="128" rx="10" fill="url(#streak)"/>
    <rect x="538" y="632" width="76" height="34" rx="13" fill="url(#specular)"/>
  </g>
  <!-- candle 2 -->
  <g>
    <line x1="716" y1="428" x2="716" y2="672" stroke="#7deaff" stroke-width="9" stroke-linecap="round" filter="url(#glowWick)"/>
    <rect x="668" y="470" width="96" height="164" rx="20" fill="url(#glassBody)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="671" y="473" width="20" height="158" rx="10" fill="url(#streak)"/>
    <rect x="678" y="476" width="76" height="38" rx="13" fill="url(#specular)"/>
  </g>
  <!-- candle 3 (tallest) -->
  <g>
    <line x1="856" y1="252" x2="856" y2="528" stroke="#7deaff" stroke-width="9" stroke-linecap="round" filter="url(#glowWick)"/>
    <rect x="808" y="296" width="96" height="196" rx="20" fill="url(#glassBody)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="811" y="299" width="20" height="190" rx="10" fill="url(#streak)"/>
    <rect x="818" y="302" width="76" height="42" rx="13" fill="url(#specular)"/>
  </g>
</svg>
