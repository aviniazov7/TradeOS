<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Signature app gradient: violet → cyan (--accent-gradient) -->
    <linearGradient id="accentLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Neutral glass candle body: frosted white with a cool cyan base -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="78%" stop-color="#bfeaf5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.20"/>
    </linearGradient>
    <!-- Specular top highlight strip -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Left-edge vertical light streak -->
    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Bottom cyan rim light inside the glass -->
    <linearGradient id="rim" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <!-- Candle border: bright at top, cyan at bottom -->
    <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7deaff" stop-opacity="0.60"/>
    </linearGradient>
    <!-- Soft ambient glow behind the mark -->
    <radialGradient id="ambient" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWick" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pure black base -->
  <rect width="1024" height="1024" fill="#000000"/>
  <rect width="1024" height="1024" fill="url(#ambient)"/>

  <!-- ===== Rising trend line (behind the candles) ===== -->
  <g filter="url(#glowSoft)">
    <path d="M 128 852 L 330 700 L 470 764 L 820 350"
          fill="none" stroke="url(#accentLine)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 810 446 L 820 350 L 727 376"
          fill="none" stroke="#22d3ee" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Glass candlesticks, ascending ===== -->
  <!-- candle 1 -->
  <g>
    <line x1="240" y1="596" x2="240" y2="880" stroke="#7deaff" stroke-width="10" stroke-linecap="round" filter="url(#glowWick)"/>
    <rect x="178" y="642" width="124" height="192" rx="26" fill="url(#glassBody)" stroke="url(#edge)" stroke-width="3.5"/>
    <rect x="182" y="646" width="116" height="184" rx="23" fill="url(#rim)" opacity="0.5"/>
    <rect x="183" y="647" width="24" height="182" rx="12" fill="url(#streak)"/>
    <rect x="190" y="650" width="100" height="44" rx="17" fill="url(#specular)"/>
  </g>
  <!-- candle 2 -->
  <g>
    <line x1="425" y1="472" x2="425" y2="812" stroke="#7deaff" stroke-width="10" stroke-linecap="round" filter="url(#glowWick)"/>
    <rect x="363" y="524" width="124" height="238" rx="26" fill="url(#glassBody)" stroke="url(#edge)" stroke-width="3.5"/>
    <rect x="367" y="528" width="116" height="230" rx="23" fill="url(#rim)" opacity="0.5"/>
    <rect x="368" y="529" width="24" height="228" rx="12" fill="url(#streak)"/>
    <rect x="375" y="532" width="100" height="50" rx="17" fill="url(#specular)"/>
  </g>
  <!-- candle 3 -->
  <g>
    <line x1="610" y1="330" x2="610" y2="700" stroke="#7deaff" stroke-width="10" stroke-linecap="round" filter="url(#glowWick)"/>
    <rect x="548" y="386" width="124" height="258" rx="26" fill="url(#glassBody)" stroke="url(#edge)" stroke-width="3.5"/>
    <rect x="552" y="390" width="116" height="250" rx="23" fill="url(#rim)" opacity="0.5"/>
    <rect x="553" y="391" width="24" height="248" rx="12" fill="url(#streak)"/>
    <rect x="560" y="394" width="100" height="54" rx="17" fill="url(#specular)"/>
  </g>
  <!-- candle 4 (tallest) -->
  <g>
    <line x1="795" y1="152" x2="795" y2="580" stroke="#7deaff" stroke-width="10" stroke-linecap="round" filter="url(#glowWick)"/>
    <rect x="733" y="214" width="124" height="300" rx="26" fill="url(#glassBody)" stroke="url(#edge)" stroke-width="3.5"/>
    <rect x="737" y="218" width="116" height="292" rx="23" fill="url(#rim)" opacity="0.5"/>
    <rect x="738" y="219" width="24" height="290" rx="12" fill="url(#streak)"/>
    <rect x="745" y="222" width="100" height="60" rx="17" fill="url(#specular)"/>
  </g>

</svg>
